<style>
/* @house-style-tokens:begin — generated from house-style-tokens.css, do not hand-edit */
/* ============================================================================
   House style tokens — the authority for every value in a generated document.
   Inline this block. It is the whole design system: colour, type, space,
   width, radius, and print. A value that is not in here does not exist.

   Two layers throughout. The reference layer names pigments and raw steps and
   holds every literal. The role layer names jobs and selects from the
   reference layer. Only the reference layer changes when the palette changes,
   and dark mode selects different steps rather than inverting.
   ============================================================================ */

:root {
  /* -- reference: neutrals ------------------------------------------------ */
  --ivory: #FAF9F5;
  --white: #FFFFFF;
  --wash-l: #F0EEE6;
  --oat-l: #E3DACC;
  --line-l: #D1CFC5;
  --line-strong-l: #BBB7AC;
  --gray-500: #87867F;   /* borders and fills only: 3.47:1 as text on ivory */
  --gray-600: #605F58;
  --gray-700: #3D3D3A;
  --slate: #141413;
  --slate-900: #1E1D1A;
  --slate-800: #282721;
  --slate-700: #333229;
  --slate-600: #3E3D38;
  --slate-500: #51504A;
  --gray-350: #B4B3AB;
  --gray-250: #CECDC5;
  --paper: #F2F0EA;

  /* -- reference: five series hues, one step per mode ---------------------
     Each set passes the palette validator under --pairs all on its own
     surface. Series colours are marks, never text: text wears text tokens. */
  --clay: #994210;      --clay-text-on-dark: #f17d44;  --clay-mark-on-dark: #bf4f04;
  --indigo: #5168b9;    --indigo-on-dark: #5c77df;
  --teal: #00a1a2;      --teal-on-dark: #009ea0;
  --ochre: #8d7f00;     --ochre-on-dark: #a79700;
  --plum: #733378;      --plum-on-dark: #98449e;

  /* -- reference: status, re-stepped per mode and per job -----------------
     Light needs one step. Dark needs two: the lightness band governs whether
     marks read as equal-weight siblings, which text does not need to do, and
     no single step satisfies both. Deriving the mark step by maximising
     chroma fails — it puts red and amber at the same lightness, the one cue
     deuteranopia leaves intact, collapsing separation to ΔE 0.5. */
  --red: #971a20;       --red-text-on-dark: #f87b5c;   --red-mark-on-dark: #ca3403;
  --amber: #896a00;     --amber-text-on-dark: #f6c330; --amber-mark-on-dark: #b78d00;
  --blue: #2757b6;      --blue-text-on-dark: #79b4ff;  --blue-mark-on-dark: #026cd1;

  /* -- reference: tinted surfaces and their borders -----------------------
     A tint is an opaque step rather than an rgba, so its contrast is a fact
     the checker can read instead of something that depends on whatever sits
     behind it. One alpha per mode against the page — 0.14 light, 0.22 dark —
     for the fill, and whatever alpha reaches 3:1 for the border, since a
     border is a non-text object. The fill is derived from the mode's text
     step and the border from its mark step.

     Text on a tint is --body, never the role colour. Solving for role-coloured
     text puts warning's light alpha at 0.02, which is no tint at all: warning
     on ivory is 4.83:1 and any tint spends the margin. The role still reads —
     it colours the border and the icon, which is what the status rule already
     requires of it. */
  --red-soft: #ecdad7;   --red-soft-on-dark: #462b23;
  --red-line: #bf7375;   --red-line-on-dark: #b83105;
  --amber-soft: #eae5d3; --amber-soft-on-dark: #463a19;
  --amber-line: #a58e3d; --amber-line-on-dark: #7e6307;
  --blue-soft: #dce2ec;  --blue-soft-on-dark: #2a3747;
  --blue-line: #7190cc;  --blue-line-on-dark: #0463be;
  --clay-soft: #ecdfd5;  --clay-soft-on-dark: #452b1e;
  --clay-line: #bb8260;  --clay-line-on-dark: #a54606;

  /* A solid button needs a hover it cannot get from the base step. One fixed
     lightness move at the same hue and chroma: darker on a light page, lighter
     on a dark one. White text stays above 8.5:1 on every one of them. */
  --clay-hover: #812c00;  --clay-hover-on-dark: #ff955d;
  --red-hover: #7e0008;   --red-hover-on-dark: #ff9373;
  --blue-hover: #11409d;  --blue-hover-on-dark: #90ccff;

  /* -- reference: families ------------------------------------------------
     ui-serif and ui-monospace resolve only in Safari; everywhere else they
     fall through to the next slot, so the named faces do the real work.
     Liberation, Noto and DejaVu are the Linux slots — without them none of
     these stacks resolves to an intended face there. */
  --font-prose: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-serif, Georgia, "Liberation Serif", "Noto Serif",
                  "DejaVu Serif", "Times New Roman", serif;
  --font-data: ui-monospace, Menlo, Consolas, "Liberation Mono",
               "DejaVu Sans Mono", monospace;

  /* -- type: nine steps, named by job so a size is chosen by meaning ------
     Calibrated for --font-prose. Two exceptions and no others: serif body
     text uses --text-body-display, mono metadata uses --text-meta-data. */
  --text-micro: 0.6875rem;   /* 11px — one glanced token, never compared */
  --text-meta: 0.8125rem;    /* 13px — UI, metadata, table cells, chart labels */
  --text-body: 1rem;         /* 16px — prose floor */
  --text-lead: 1.125rem;     /* 18px */
  --text-h4: 1.3125rem;      /* 21px */
  --text-h3: 1.5rem;         /* 24px */
  --text-h2: 1.875rem;       /* 30px */
  --text-h1: 2.375rem;       /* 38px */
  --text-display: 3.25rem;   /* 52px — one per document */

  /* Equal apparent size across families: x-height/em is 0.508 prose,
     0.481 display, 0.547 data. */
  --text-body-display: 1.125rem;  /* 18px serif reads as 16px sans */
  --text-meta-data: 0.75rem;      /* 12px mono reads as 13px sans */

  /* -- weight: two values --------------------------------------------------
     Georgia renders 400 and 500 identically and 600 identically to 700;
     Segoe UI has no 500 face; DejaVu and Liberation have two weights. For
     emphasis between normal and bold, change family or size. */
  --weight-normal: 400;
  --weight-bold: 700;

  /* -- leading and tracking ----------------------------------------------- */
  --leading-tight: 1.15;   /* 30px and up */
  --leading-snug: 1.35;    /* headings 18–24px, table cells */
  --leading-normal: 1.55;  /* body prose */
  --leading-loose: 1.7;    /* prose at --text-meta */
  --track-display: -0.02em;
  --track-normal: 0;
  --track-caps: 0.08em;    /* uppercase labels: required, not decorative */
  --track-micro: 0.04em;   /* 11–13px mono, to offset crowding */

  /* -- space: twelve rungs on a 4pt grid ---------------------------------- */
  --sp-0: 0px;   --sp-2: 2px;   --sp-4: 4px;   --sp-8: 8px;
  --sp-12: 12px; --sp-16: 16px; --sp-20: 20px; --sp-24: 24px;
  --sp-32: 32px; --sp-48: 48px; --sp-64: 64px; --sp-96: 96px;

  /* -- radius: four values ------------------------------------------------ */
  --r-4: 4px; --r-8: 8px; --r-12: 12px; --r-full: 999px;

  /* Every border in the system is one pixel, so pulling an element up by exactly
     one border width is a real measurement rather than a gap off the scale. */
  --hairline: 1px;

  /* -- width -------------------------------------------------------------
     278 + 32 + 726 = 1036 = 1100 − 2×32. The 726/278 split is 2.6115,
     0.249% off φ². Prose caps well below its column: 726px runs about 94
     characters, and 540 runs 70–74. Tables, charts and code use the column. */
  --page-pad: 32px;
  --gutter: 32px;
  --w-rail: 278px;
  --w-text: 726px;
  --w-measure: 540px;
  --shell: 1100px;
  --shell-read: 808px;
  --shell-wide: 1320px;
  --w-steps: 320px;
  --w-pane: 840px;
  --w-card: 344px;
  --w-card-wide: 464px;

  /* -- elevation ---------------------------------------------------------- */
  --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.08);
  /* A negative spread, so the shadow reads as a lifted edge rather than a halo. */
  --shadow-edge: 0 10px 16px -12px rgba(0, 0, 0, 0.35);

  /* -- motion: two curves ------------------------------------------------
     Standard for anything that moves between two states. Overshoot only for
     a deliberate bounce, which is a decision about the animation rather than
     a default. */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* -- role: light -------------------------------------------------------- */
  --bg: var(--ivory);
  --surface: var(--white);
  --wash: var(--wash-l);
  --line: var(--line-l);
  --line-strong: var(--line-strong-l);
  --oat: var(--oat-l);
  --ink: var(--slate);
  --body: var(--gray-700);
  --muted: var(--gray-600);
  --fill: var(--gray-500);

  /* Slot order is fixed and never cycled. Indigo leads so a single-series chart
     reads as data rather than as branding, and clay sits last because it is also
     the accent, which stays reserved for emphasis. The order is chosen by
     measured adjacent separation: this arrangement lifts the worst adjacent
     tritan pair from 6.6 to 14.9 light and 16.0 dark. */
  --s1: var(--indigo);
  --s2: var(--ochre);
  --s3: var(--plum);
  --s4: var(--teal);
  --s5: var(--clay);

  --critical: var(--red);
  --critical-mark: var(--red);
  --warning: var(--amber);
  --warning-mark: var(--amber);
  --positive: var(--blue);
  --positive-mark: var(--blue);

  --accent: var(--clay);
  --accent-mark: var(--clay);

  /* A solid status or accent fill and the label that sits on it. This pair does
     not follow the text steps: --accent in dark mode is a light orange meant to
     be read as text, and a white label on it measures 2.71:1. A solid fill is a
     non-text object, so it needs 3:1 against the page and 4.5:1 for its own
     label — light mode gets that from the light pigment, dark mode from the mark
     step. Warning is the one whose label differs by mode, because amber is light
     enough that white fails on it. */
  --accent-solid: var(--clay);       --on-accent: var(--white);
  --critical-solid: var(--red);      --on-critical: var(--white);
  --warning-solid: var(--amber);     --on-warning: var(--white);
  --positive-solid: var(--blue);     --on-positive: var(--white);

  /* A tinted surface and its border. Text on one of these is --body. */
  --critical-soft: var(--red-soft);      --critical-line: var(--red-line);
  --warning-soft: var(--amber-soft);     --warning-line: var(--amber-line);
  --positive-soft: var(--blue-soft);     --positive-line: var(--blue-line);
  --accent-soft: var(--clay-soft);       --accent-line: var(--clay-line);
  --critical-hover: var(--red-hover);
  --positive-hover: var(--blue-hover);
  --accent-hover: var(--clay-hover);

  /* An inverted band — a punch slide, a summary callout, a primary control. It is
     defined against the page, so it flips with it: painting one --panel would make
     it the dark page's own colour and invert nothing. The muted tier is its own
     token because it inverts too, and --muted is the page's tier, not this one. */
  --invert: var(--ink);
  --on-invert: var(--bg);
  --on-invert-muted: var(--gray-350);
  /* The accent inverts too: --accent is solved against the page, and an inverted
     band is the opposite of the page, so it takes the other mode's step. */
  --on-invert-accent: var(--clay-text-on-dark);

  --zone: rgba(20, 20, 19, 0.025);
  /* A banded row inside an always-dark panel. It cannot use --zone, which
     inverts with the mode while the panel does not. */
  --panel-zone: rgba(250, 249, 245, 0.045);

  /* -- role: the always-dark panel ---------------------------------------
     A code listing or diff view is one colour in both modes, so the mode-aware
     roles are wrong inside it: --muted resolves to #605F58 in light mode and
     would sit at 2.87:1 on this surface. These do not change between modes,
     which is the whole point of them. */
  --panel: var(--slate);
  --panel-raised: var(--gray-700);
  --panel-ink: var(--paper);
  --panel-body: var(--gray-250);
  /* --gray-500 is 2.98:1 on --panel-raised, so the muted tier steps up one:
     a panel's own de-emphasis tier has to clear AA on the raised surface too,
     not only on the panel. */
  --panel-muted: var(--gray-350);
  /* The seam between a panel and the page, and the one panel role that flips.
     In dark mode --panel and --bg are the same step by design, so a code block
     with no edge has no boundary at all. Light mode needs none: a near-black
     panel on ivory is already its own boundary, so the edge takes the panel's
     colour there and disappears. */
  --panel-edge: var(--panel);
  /* A panel's own status steps. A diff row inside an always-dark panel cannot take
     --positive-soft: that tint is solved against the page and flips, so in light
     mode it paints a pale band inside a black panel and the panel's own ink lands
     on it at 1.14:1. These hold the on-dark steps in both modes, like the rest of
     the panel roles. */
  --panel-critical: var(--red-text-on-dark);
  --panel-positive: var(--blue-text-on-dark);
  /* A step up from the plain dark accent, because this one also has to clear AA
     on the panel's own tinted rows, not only on the panel: --clay-text-on-dark
     is 4.47:1 on --panel-positive-soft. */
  --panel-accent: var(--clay-hover-on-dark);
  --panel-critical-soft: var(--red-soft-on-dark);
  --panel-positive-soft: var(--blue-soft-on-dark);

  /* A scrim behind a modal or over an image. Dark in both modes: it darkens
     whatever it covers rather than following the page. */
  --scrim: rgba(20, 20, 19, 0.55);
}

html.dark {
  /* Different steps, never an inversion. */
  --bg: var(--slate);
  --surface: var(--slate-900);
  --wash: var(--slate-800);
  --oat: var(--slate-700);
  --line: var(--slate-600);
  --line-strong: var(--slate-500);
  --ink: var(--paper);
  --body: var(--gray-250);
  --muted: var(--gray-350);
  --fill: var(--gray-500);

  --s1: var(--indigo-on-dark);
  --s2: var(--ochre-on-dark);
  --s3: var(--plum-on-dark);
  --s4: var(--teal-on-dark);
  --s5: var(--clay-mark-on-dark);

  --critical: var(--red-text-on-dark);
  --critical-mark: var(--red-mark-on-dark);
  --warning: var(--amber-text-on-dark);
  --warning-mark: var(--amber-mark-on-dark);
  --positive: var(--blue-text-on-dark);
  --positive-mark: var(--blue-mark-on-dark);

  --accent: var(--clay-text-on-dark);
  --accent-mark: var(--clay-mark-on-dark);

  --accent-solid: var(--clay-mark-on-dark);    --on-accent: var(--white);
  --critical-solid: var(--red-mark-on-dark);   --on-critical: var(--white);
  --warning-solid: var(--amber-mark-on-dark);  --on-warning: var(--slate);
  --positive-solid: var(--blue-mark-on-dark);  --on-positive: var(--white);

  --critical-soft: var(--red-soft-on-dark);   --critical-line: var(--red-line-on-dark);
  --warning-soft: var(--amber-soft-on-dark);  --warning-line: var(--amber-line-on-dark);
  --positive-soft: var(--blue-soft-on-dark);  --positive-line: var(--blue-line-on-dark);
  --accent-soft: var(--clay-soft-on-dark);    --accent-line: var(--clay-line-on-dark);
  --critical-hover: var(--red-hover-on-dark);
  --positive-hover: var(--blue-hover-on-dark);
  --accent-hover: var(--clay-hover-on-dark);

  --panel-edge: var(--gray-600);
  --on-invert-muted: var(--gray-600);
  --on-invert-accent: var(--clay);

  --zone: rgba(250, 249, 245, 0.03);
  --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.45);
  --shadow-edge: 0 10px 16px -12px rgba(0, 0, 0, 0.45);

  /* Light-on-dark reads heavier than dark-on-light at the same weight, and a
     weight step down is unavailable on two-weight faces. Loosen instead. */
  --leading-normal: 1.65;
}

/* Numbers that must align in a column or hold position in a chart use the data
   face. tabular-nums measures as a no-op on Georgia, Times, Arial and
   Helvetica, so it is an enhancement and never the mechanism. */
.tabular {
  font-family: var(--font-data);
  font-variant-numeric: tabular-nums;
}

.label-caps {
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  font-size: var(--text-meta);
  font-weight: var(--weight-bold);
}

/* A band cancels the page padding to span the shell's outer box. Neither
   width:100vw nor width:100% is correct: inside a split track both resolve to
   the wrong box, and 100vw ignores the scrollbar. */
.bleed {
  margin-inline: calc(-1 * var(--page-pad));
  padding-inline: var(--page-pad);
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

@media print {
  /* prefers-color-scheme is not suppressed for print, so a dark-mode reader
     exports a black page unless the role layer is reset to light here. */
  :root,
  html.dark {
    color-scheme: light;
    --bg: var(--ivory);
    --surface: var(--white);
    --wash: var(--wash-l);
    --line: var(--line-l);
    --line-strong: var(--line-strong-l);
    --ink: var(--slate);
    --body: var(--gray-700);
    --muted: var(--gray-600);
    --s1: var(--indigo);
    --s2: var(--ochre);
    --s3: var(--plum);
    --s4: var(--teal);
    --s5: var(--clay);
    --critical: var(--red);
    --critical-mark: var(--red);
    --warning: var(--amber);
    --warning-mark: var(--amber);
    --positive: var(--blue);
    --positive-mark: var(--blue);
    --oat: var(--oat-l);
    --panel-edge: var(--panel);
    --on-invert-muted: var(--gray-350);
    --on-invert-accent: var(--clay-text-on-dark);
    --accent: var(--clay);
    --accent-mark: var(--clay);
    --accent-solid: var(--clay);       --on-accent: var(--white);
    --critical-solid: var(--red);      --on-critical: var(--white);
    --warning-solid: var(--amber);     --on-warning: var(--white);
    --positive-solid: var(--blue);     --on-positive: var(--white);
    --critical-soft: var(--red-soft);      --critical-line: var(--red-line);
    --warning-soft: var(--amber-soft);     --warning-line: var(--amber-line);
    --positive-soft: var(--blue-soft);     --positive-line: var(--blue-line);
    --accent-soft: var(--clay-soft);       --accent-line: var(--clay-line);
    --critical-hover: var(--red-hover);
    --positive-hover: var(--blue-hover);
    --accent-hover: var(--clay-hover);
    --leading-normal: 1.45;
  }

  body {
    background: var(--bg);
    color: var(--body);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  thead { display: table-header-group; }
  tr, figure, pre { break-inside: avoid; }
  h1, h2, h3 { break-after: avoid; }
  p { orphans: 3; widows: 3; }

  .no-print { display: none; }

  @page { margin: 16mm; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
/* @house-style-tokens:end */

  /* Legacy names this file's own CSS still resolves, pointed at the
     token block above so there is one source for every value. */
  :root {
    --serif: var(--font-display);
    --sans: var(--font-prose);
    --mono: var(--font-data);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--text-body);
    line-height: 1.5;
  }
  .wrap {
    max-width: var(--shell);
    margin: 0 auto;
    padding: var(--sp-48) var(--sp-32) var(--sp-64);
  }

  /* ---------- header ---------- */
  header { margin-bottom: var(--sp-24); }
  .eyebrow {
    font-family: var(--mono);
    font-size: var(--text-micro);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: var(--serif);
    font-weight: var(--weight-normal);
    font-size: var(--text-h2);
    letter-spacing: -0.01em;
    margin: var(--sp-8) 0 var(--sp-4);
  }
  .sub {
    color: var(--muted);
    max-width: var(--w-measure);
    margin: 0;
  }
  .hintline {
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--muted);
    margin-top: var(--sp-12);
  }
  .hintline::before {
    content: "›";
    color: var(--accent);
    margin-right: var(--sp-8);
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: var(--sp-16);
    padding: var(--sp-16) 0 var(--sp-12);
    margin-bottom: var(--sp-16);
    border-bottom: 1.5px solid var(--line);
  }
  .summary {
    font-family: var(--mono);
    font-size: var(--text-meta);
    color: var(--body);
    letter-spacing: 0.01em;
  }
  .summary b { color: var(--ink); font-weight: var(--weight-bold); }
  .summary .dot { color: var(--muted); margin: 0 var(--sp-4); }
  .spacer { flex: 1; }
  .filter-active {
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--accent);
    background: var(--wash);
    border: 1.5px solid var(--line);
    border-radius: var(--r-full);
    padding: var(--sp-4) var(--sp-12);
    cursor: pointer;
    display: none;
  }
  .filter-active.on { display: inline-block; }
  .filter-active:hover { border-color: var(--accent); }
  button.primary {
    background: var(--invert);
    color: var(--on-invert);
    border: 1.5px solid var(--invert);
    border-radius: var(--r-full);
    font-family: var(--mono);
    font-size: var(--text-meta);
    padding: var(--sp-12) var(--sp-16);
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  button.primary:hover { background: var(--body); }
  button.primary.copied { background: var(--positive); border-color: var(--positive); }
  button.ghost {
    background: transparent;
    color: var(--body);
    border: 1.5px solid var(--line);
    border-radius: var(--r-full);
    font-family: var(--mono);
    font-size: var(--text-meta);
    padding: var(--sp-12) var(--sp-16);
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--fill); }

  /* ---------- board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--sp-16);
    align-items: start;
  }
  .col {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col[data-col="now"]   { border-top: 3px solid var(--accent); }
  .col[data-col="next"]  { border-top: 3px solid var(--positive); }
  .col[data-col="later"] { border-top: 3px solid var(--fill); }
  .col[data-col="cut"]   { border-top: 3px solid var(--line); }
  .col.dragover {
    outline: 2px dashed var(--accent);
    outline-offset: -6px;
    background: var(--bg);
  }
  .col-head {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--surface);
    display: flex;
    align-items: baseline;
    gap: var(--sp-8);
    padding: var(--sp-16) var(--sp-16) var(--sp-12);
    border-bottom: 1.5px solid var(--line);
  }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: var(--weight-normal);
    font-size: var(--text-lead);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .col-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--muted);
    background: var(--wash);
    border: 1.5px solid var(--line);
    border-radius: var(--r-full);
    padding: var(--sp-2) var(--sp-8);
    min-width: 26px;
    text-align: center;
  }
  .col-body {
    padding: var(--sp-12) var(--sp-12) var(--sp-8);
    display: flex;
    flex-direction: column;
    gap: var(--sp-8);
    flex: 1;
    min-height: 60px;
  }
  .col-foot {
    border-top: 1.5px solid var(--line);
    padding: var(--sp-8) var(--sp-16) var(--sp-12);
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .col-foot b { color: var(--body); font-weight: var(--weight-bold); }

  /* ---------- ticket card ---------- */
  .ticket {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-8);
    padding: var(--sp-12) var(--sp-12) var(--sp-12);
    cursor: grab;
    user-select: none;
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .ticket:hover { border-color: var(--fill); box-shadow: 0 1px 3px var(--zone); }
  .ticket:active { cursor: grabbing; }
  .ticket.dragging { opacity: .4; }
  .ticket.dim { opacity: .25; }
  .ticket-top {
    display: flex;
    align-items: center;
    gap: var(--sp-8);
    margin-bottom: var(--sp-8);
  }
  .tid {
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .tag {
    font-family: var(--mono);
    font-size: var(--text-micro);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: var(--r-full);
    padding: var(--sp-2) var(--sp-8) var(--sp-2);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .tag:hover { filter: brightness(0.96); }
  .tag-bug   { background: var(--accent-soft); color: var(--body); border-color: var(--line); }
  .tag-feat  { background: var(--wash); color: var(--muted); border-color: var(--line); }
  .tag-chore { background: var(--wash); color: var(--body); border-color: var(--line); }
  .tag-debt  { background: var(--wash); color: var(--body); border-color: var(--line); }
  .est {
    margin-left: auto;
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--muted);
    border: 1.5px solid var(--line);
    border-radius: var(--r-4);
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ttitle {
    font-size: var(--text-meta);
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: var(--sp-8);
  }
  .ticket-bot {
    display: flex;
    align-items: center;
    gap: var(--sp-8);
  }
  .owner {
    font-family: var(--mono);
    font-size: var(--text-micro);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--oat);
    color: var(--body);
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }
  .owner.o2 { background: var(--warning-soft); }
  .owner.o3 { background: var(--critical-soft); }
  .owner.o4 { background: var(--wash); }

  @media (max-width: 920px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<!-- @house-style-theme:begin — generated from house-style-theme.html, do not hand-edit -->
<script>
  /* The class is set before the body paints, so a dark-mode reader never sees a
     light flash. localStorage wins over the OS preference because a reader who
     has chosen on this page has chosen more specifically. */
  (function () {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);

    addEventListener('DOMContentLoaded', function () {
      const button = document.createElement('button');
      button.id = 'themeToggle';
      button.type = 'button';
      button.textContent = 'Theme';
      button.setAttribute('aria-label', 'Switch between light and dark');
      button.addEventListener('click', function () {
        const next = !document.documentElement.classList.contains('dark');
        document.documentElement.classList.toggle('dark', next);
        localStorage.setItem('theme', next ? 'dark' : 'light');
      });
      document.body.appendChild(button);
    });
  })();
</script>
<style>
  /* Fixed rather than in the flow: this fragment is shared across documents whose
     headers all differ. The bottom corner rather than the top one, because the top
     right is where a document puts its own toolbar controls and a shared button
     lands on them. */
  #themeToggle {
    position: fixed;
    /* A document with its own fixture in this corner moves the button rather
       than sitting on top of it. */
    bottom: var(--theme-toggle-bottom, var(--sp-16));
    right: var(--theme-toggle-right, var(--sp-16));
    z-index: 50;
    min-height: var(--sp-24);
    padding: var(--sp-4) var(--sp-12);
    font-family: var(--font-data);
    font-size: var(--text-meta-data);
    text-transform: uppercase;
    letter-spacing: var(--track-caps);
    color: var(--muted);
    background: var(--surface);
    border: var(--hairline) solid var(--line);
    border-radius: var(--r-full);
    cursor: pointer;
  }
  #themeToggle:hover { color: var(--ink); border-color: var(--line-strong); }
  @media print { #themeToggle { display: none; } }
</style>
<!-- @house-style-theme:end -->
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Acme / editor / triage</div>
    <h1>Cycle 14 triage</h1>
    <p class="sub">
      Twenty-four open Linear tickets, pre-sorted into a best guess. Drag them
      across Now / Next / Later / Cut until the cut feels right, then copy the
      result back into the planning doc as markdown.
    </p>
    <div class="hintline">drag tickets between columns &nbsp;·&nbsp; click a tag to filter</div>
  </header>

  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="spacer"></div>
    <button class="filter-active" id="filterBadge"></button>
    <button class="ghost" id="resetBtn">Reset</button>
    <button class="primary" id="copyBtn">Copy as markdown</button>
  </div>

  <div class="board" id="board"></div>

</div>

<script>
  // ---------- data ----------
  var COLUMNS = [
    { key: 'now',   label: 'Now',   rationale: 'Blocking the v2.4 release or actively losing user data.' },
    { key: 'next',  label: 'Next',  rationale: 'High-leverage and well-scoped — start the moment Now clears.' },
    { key: 'later', label: 'Later', rationale: 'Real, but can ride to a future cycle without anyone noticing.' },
    { key: 'cut',   label: 'Cut',   rationale: 'Not this quarter — close, dedupe, or push back to the requester.' }
  ];

  var EST_PTS = { S: 1, M: 2, L: 3 };

  // tag, est, owner, col
  var INITIAL = [
    { id: 'BIR-241', title: 'Fix sync conflict toast firing twice on reconnect', tag: 'bug',   est: 'M', owner: 'AK', col: 'now' },
    { id: 'BIR-238', title: 'Comments lost when editing offline then reloading', tag: 'bug',   est: 'L', owner: 'JM', col: 'now' },
    { id: 'BIR-252', title: 'Billing webhook 500s on annual → monthly downgrade', tag: 'bug',   est: 'M', owner: 'RS', col: 'now' },
    { id: 'BIR-219', title: 'Migrate workspace permissions to new ACL table',    tag: 'debt',  est: 'L', owner: 'AK', col: 'now' },
    { id: 'BIR-260', title: 'SSO login loop on Safari 17 with strict cookies',   tag: 'bug',   est: 'S', owner: 'TN', col: 'now' },

    { id: 'BIR-244', title: 'Inline @-mention picker in doc comments',           tag: 'feat',  est: 'M', owner: 'JM', col: 'next' },
    { id: 'BIR-231', title: 'Bulk-archive completed projects from the sidebar',  tag: 'feat',  est: 'S', owner: 'EL', col: 'next' },
    { id: 'BIR-247', title: 'Activity feed: collapse repeated edit events',      tag: 'feat',  est: 'M', owner: 'TN', col: 'next' },
    { id: 'BIR-228', title: 'Notification preferences per project',              tag: 'feat',  est: 'L', owner: 'EL', col: 'next' },
    { id: 'BIR-255', title: 'Keyboard shortcut cheat-sheet overlay (⌘/)',        tag: 'feat',  est: 'S', owner: 'RS', col: 'next' },
    { id: 'BIR-236', title: 'Empty-state illustrations for new workspaces',      tag: 'chore', est: 'S', owner: 'EL', col: 'next' },
    { id: 'BIR-249', title: 'Audit log export to CSV for admins',                tag: 'feat',  est: 'M', owner: 'AK', col: 'next' },

    { id: 'BIR-213', title: 'Dark mode pass on settings + billing pages',        tag: 'chore', est: 'M', owner: 'EL', col: 'later' },
    { id: 'BIR-258', title: 'Slack integration: post on milestone close',        tag: 'feat',  est: 'M', owner: 'RS', col: 'later' },
    { id: 'BIR-221', title: 'Replace moment.js with date-fns across web',        tag: 'debt',  est: 'L', owner: 'TN', col: 'later' },
    { id: 'BIR-263', title: 'Drag-to-reorder columns on the board view',         tag: 'feat',  est: 'M', owner: 'JM', col: 'later' },
    { id: 'BIR-209', title: 'Upgrade Postgres minor + reindex search vectors',   tag: 'chore', est: 'M', owner: 'AK', col: 'later' },
    { id: 'BIR-251', title: 'Per-doc read receipts in the share dialog',         tag: 'feat',  est: 'L', owner: 'JM', col: 'later' },
    { id: 'BIR-240', title: 'Onboarding checklist resurfaces after dismissal',   tag: 'bug',   est: 'S', owner: 'TN', col: 'later' },
    { id: 'BIR-265', title: 'Add request-id to client error reports',            tag: 'debt',  est: 'S', owner: 'RS', col: 'later' },

    { id: 'BIR-198', title: 'Custom emoji reactions on comments',                tag: 'feat',  est: 'M', owner: 'EL', col: 'cut' },
    { id: 'BIR-204', title: 'Native Windows desktop wrapper',                    tag: 'feat',  est: 'L', owner: 'TN', col: 'cut' },
    { id: 'BIR-217', title: 'AI summary of long comment threads',                tag: 'feat',  est: 'L', owner: 'JM', col: 'cut' },
    { id: 'BIR-233', title: 'Public roadmap page with voting',                   tag: 'feat',  est: 'L', owner: 'RS', col: 'cut' }
  ];

  var OWNER_CLASS = { AK: 'o1', JM: 'o2', RS: 'o3', TN: 'o4', EL: 'o1' };

  var tickets = [];          // live state
  var activeFilter = null;   // tag string or null
  var dragId = null;

  // ---------- build DOM ----------
  var board = document.getElementById('board');
  var colBodies = {};
  var colCounts = {};
  var colFoots = {};

  COLUMNS.forEach(function (c) {
    var col = document.createElement('section');
    col.className = 'col';
    col.dataset.col = c.key;

    var head = document.createElement('div');
    head.className = 'col-head';
    var h2 = document.createElement('h2');
    h2.textContent = c.label;
    var count = document.createElement('span');
    count.className = 'count';
    head.appendChild(h2);
    head.appendChild(count);

    var body = document.createElement('div');
    body.className = 'col-body';

    var foot = document.createElement('div');
    foot.className = 'col-foot';

    col.appendChild(head);
    col.appendChild(body);
    col.appendChild(foot);
    board.appendChild(col);

    colBodies[c.key] = body;
    colCounts[c.key] = count;
    colFoots[c.key] = foot;

    // drop targets
    col.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('dragover');
    });
    col.addEventListener('dragleave', function (e) {
      if (!col.contains(e.relatedTarget)) col.classList.remove('dragover');
    });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('dragover');
      if (!dragId) return;
      var t = tickets.find(function (x) { return x.id === dragId; });
      if (t && t.col !== c.key) { t.col = c.key; render(); }
    });
  });

  function makeCard(t) {
    var card = document.createElement('article');
    card.className = 'ticket';
    card.draggable = true;
    card.dataset.id = t.id;
    if (activeFilter && t.tag !== activeFilter) card.classList.add('dim');

    var top = document.createElement('div');
    top.className = 'ticket-top';
    var tid = document.createElement('span');
    tid.className = 'tid';
    tid.textContent = t.id;
    var tag = document.createElement('button');
    tag.type = 'button';
    tag.className = 'tag tag-' + t.tag;
    tag.textContent = t.tag;
    tag.addEventListener('click', function (e) {
      e.stopPropagation();
      activeFilter = (activeFilter === t.tag) ? null : t.tag;
      render();
    });
    var est = document.createElement('span');
    est.className = 'est';
    est.textContent = t.est;
    top.appendChild(tid);
    top.appendChild(tag);
    top.appendChild(est);

    var title = document.createElement('div');
    title.className = 'ttitle';
    title.textContent = t.title;

    var bot = document.createElement('div');
    bot.className = 'ticket-bot';
    var owner = document.createElement('span');
    owner.className = 'owner ' + (OWNER_CLASS[t.owner] || 'o1');
    owner.textContent = t.owner;
    bot.appendChild(owner);

    card.appendChild(top);
    card.appendChild(title);
    card.appendChild(bot);

    card.addEventListener('dragstart', function (e) {
      dragId = t.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', t.id);
    });
    card.addEventListener('dragend', function () {
      dragId = null;
      card.classList.remove('dragging');
      document.querySelectorAll('.col.dragover').forEach(function (el) {
        el.classList.remove('dragover');
      });
    });

    return card;
  }

  function render() {
    COLUMNS.forEach(function (c) { colBodies[c.key].innerHTML = ''; });
    var counts = {};
    var pts = {};
    COLUMNS.forEach(function (c) { counts[c.key] = 0; pts[c.key] = 0; });

    tickets.forEach(function (t) {
      colBodies[t.col].appendChild(makeCard(t));
      counts[t.col] += 1;
      pts[t.col] += EST_PTS[t.est] || 0;
    });

    COLUMNS.forEach(function (c) {
      colCounts[c.key].textContent = counts[c.key];
      colFoots[c.key].innerHTML = 'estimate <b>' + pts[c.key] + ' pt' + (pts[c.key] === 1 ? '' : 's') + '</b>';
    });

    var summary = document.getElementById('summary');
    summary.innerHTML = COLUMNS.map(function (c) {
      return '<b>' + counts[c.key] + '</b>&nbsp;' + c.key;
    }).join('<span class="dot">·</span>');

    var badge = document.getElementById('filterBadge');
    if (activeFilter) {
      badge.textContent = 'filter: ' + activeFilter + ' ×';
      badge.classList.add('on');
    } else {
      badge.classList.remove('on');
    }
  }

  document.getElementById('filterBadge').addEventListener('click', function () {
    activeFilter = null;
    render();
  });

  // ---------- export ----------
  function buildMarkdown() {
    var lines = [];
    lines.push('# Acme — Cycle 14 triage');
    lines.push('');
    COLUMNS.forEach(function (c) {
      var rows = tickets.filter(function (t) { return t.col === c.key; });
      var pts = rows.reduce(function (s, t) { return s + (EST_PTS[t.est] || 0); }, 0);
      lines.push('## ' + c.label + ' (' + rows.length + ' · ' + pts + ' pts)');
      lines.push('');
      lines.push('_' + c.rationale + '_');
      lines.push('');
      rows.forEach(function (t) {
        lines.push('- **' + t.id + '** ' + t.title + ' — ' + t.tag + ', ' + t.est + ', ' + t.owner);
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  var copyBtn = document.getElementById('copyBtn');
  var copyTimer = null;
  copyBtn.addEventListener('click', function () {
    var md = buildMarkdown();
    function flash() {
      copyBtn.textContent = 'Copied ✓';
      copyBtn.classList.add('copied');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () {
        copyBtn.textContent = 'Copy as markdown';
        copyBtn.classList.remove('copied');
      }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(flash, flash);
    } else {
      var ta = document.createElement('textarea');
      ta.value = md;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      flash();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    tickets = INITIAL.map(function (t) { return Object.assign({}, t); });
    activeFilter = null;
    render();
  });

  // ---------- init ----------
  tickets = INITIAL.map(function (t) { return Object.assign({}, t); });
  render();
</script>
</body>
