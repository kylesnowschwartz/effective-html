<script>
  /* The class is set before the body paints, so a dark-mode reader never sees a
     light flash. localStorage wins over the OS preference because a reader who
     has chosen on this page has chosen more specifically. */
  (function () {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);

    addEventListener('DOMContentLoaded', function () {
      const button = document.createElement('button');
      button.id = 'themeToggle';
      button.type = 'button';
      button.textContent = 'Theme';
      button.setAttribute('aria-label', 'Switch between light and dark');
      button.addEventListener('click', function () {
        const next = !document.documentElement.classList.contains('dark');
        document.documentElement.classList.toggle('dark', next);
        localStorage.setItem('theme', next ? 'dark' : 'light');
      });
      document.body.appendChild(button);
    });
  })();
</script>
