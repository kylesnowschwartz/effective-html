<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspaces — Architecture</title>
<script>
  (function () {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<style>
/* @house-style-tokens:begin — generated from house-style-tokens.css, do not hand-edit */
/* ============================================================================
   House style tokens — the authority for every value in a generated document.
   Inline this block. It is the whole design system: colour, type, space,
   width, radius, and print. A value that is not in here does not exist.

   Two layers throughout. The reference layer names pigments and raw steps and
   holds every literal. The role layer names jobs and selects from the
   reference layer. Only the reference layer changes when the palette changes,
   and dark mode selects different steps rather than inverting.
   ============================================================================ */

:root {
  /* -- reference: neutrals ------------------------------------------------ */
  --ivory: #FAF9F5;
  --white: #FFFFFF;
  --wash-l: #F0EEE6;
  --oat-l: #E3DACC;
  --line-l: #D1CFC5;
  --line-strong-l: #BBB7AC;
  --gray-500: #87867F;   /* borders and fills only: 3.47:1 as text on ivory */
  --gray-600: #605F58;
  --gray-700: #3D3D3A;
  --slate: #141413;
  --slate-900: #1E1D1A;
  --slate-800: #282721;
  --slate-700: #333229;
  --slate-600: #3E3D38;
  --slate-500: #51504A;
  --gray-350: #B4B3AB;
  --gray-250: #CECDC5;
  --paper: #F2F0EA;

  /* -- reference: five series hues, one step per mode ---------------------
     Each set passes the palette validator under --pairs all on its own
     surface. Series colours are marks, never text: text wears text tokens. */
  --clay: #994210;      --clay-text-on-dark: #f17d44;  --clay-mark-on-dark: #bf4f04;
  --indigo: #5168b9;    --indigo-on-dark: #5c77df;
  --teal: #00a1a2;      --teal-on-dark: #009ea0;
  --ochre: #8d7f00;     --ochre-on-dark: #a79700;
  --plum: #733378;      --plum-on-dark: #98449e;

  /* -- reference: status, re-stepped per mode and per job -----------------
     Light needs one step. Dark needs two: the lightness band governs whether
     marks read as equal-weight siblings, which text does not need to do, and
     no single step satisfies both. Deriving the mark step by maximising
     chroma fails — it puts red and amber at the same lightness, the one cue
     deuteranopia leaves intact, collapsing separation to ΔE 0.5. */
  --red: #971a20;       --red-text-on-dark: #f87b5c;   --red-mark-on-dark: #ca3403;
  --amber: #896a00;     --amber-text-on-dark: #f6c330; --amber-mark-on-dark: #b78d00;
  --blue: #2757b6;      --blue-text-on-dark: #79b4ff;  --blue-mark-on-dark: #026cd1;

  /* -- reference: tinted surfaces and their borders -----------------------
     A tint is an opaque step rather than an rgba, so its contrast is a fact
     the checker can read instead of something that depends on whatever sits
     behind it. One alpha per mode against the page — 0.14 light, 0.22 dark —
     for the fill, and whatever alpha reaches 3:1 for the border, since a
     border is a non-text object. The fill is derived from the mode's text
     step and the border from its mark step.

     Text on a tint is --body, never the role colour. Solving for role-coloured
     text puts warning's light alpha at 0.02, which is no tint at all: warning
     on ivory is 4.83:1 and any tint spends the margin. The role still reads —
     it colours the border and the icon, which is what the status rule already
     requires of it. */
  --red-soft: #ecdad7;   --red-soft-on-dark: #462b23;
  --red-line: #bf7375;   --red-line-on-dark: #b83105;
  --amber-soft: #eae5d3; --amber-soft-on-dark: #463a19;
  --amber-line: #a58e3d; --amber-line-on-dark: #7e6307;
  --blue-soft: #dce2ec;  --blue-soft-on-dark: #2a3747;
  --blue-line: #7190cc;  --blue-line-on-dark: #0463be;
  --clay-soft: #ecdfd5;  --clay-soft-on-dark: #452b1e;
  --clay-line: #bb8260;  --clay-line-on-dark: #a54606;

  /* A solid button needs a hover it cannot get from the base step. One fixed
     lightness move at the same hue and chroma: darker on a light page, lighter
     on a dark one. White text stays above 8.5:1 on every one of them. */
  --clay-hover: #812c00;  --clay-hover-on-dark: #ff955d;
  --red-hover: #7e0008;   --red-hover-on-dark: #ff9373;
  --blue-hover: #11409d;  --blue-hover-on-dark: #90ccff;

  /* -- reference: families ------------------------------------------------
     ui-serif and ui-monospace resolve only in Safari; everywhere else they
     fall through to the next slot, so the named faces do the real work.
     Liberation, Noto and DejaVu are the Linux slots — without them none of
     these stacks resolves to an intended face there. */
  --font-prose: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-serif, Georgia, "Liberation Serif", "Noto Serif",
                  "DejaVu Serif", "Times New Roman", serif;
  --font-data: ui-monospace, Menlo, Consolas, "Liberation Mono",
               "DejaVu Sans Mono", monospace;

  /* -- type: nine steps, named by job so a size is chosen by meaning ------
     Calibrated for --font-prose. Two exceptions and no others: serif body
     text uses --text-body-display, mono metadata uses --text-meta-data. */
  --text-micro: 0.6875rem;   /* 11px — one glanced token, never compared */
  --text-meta: 0.8125rem;    /* 13px — UI, metadata, table cells, chart labels */
  --text-body: 1rem;         /* 16px — prose floor */
  --text-lead: 1.125rem;     /* 18px */
  --text-h4: 1.3125rem;      /* 21px */
  --text-h3: 1.5rem;         /* 24px */
  --text-h2: 1.875rem;       /* 30px */
  --text-h1: 2.375rem;       /* 38px */
  --text-display: 3.25rem;   /* 52px — one per document */

  /* Equal apparent size across families: x-height/em is 0.508 prose,
     0.481 display, 0.547 data. */
  --text-body-display: 1.125rem;  /* 18px serif reads as 16px sans */
  --text-meta-data: 0.75rem;      /* 12px mono reads as 13px sans */

  /* -- weight: two values --------------------------------------------------
     Georgia renders 400 and 500 identically and 600 identically to 700;
     Segoe UI has no 500 face; DejaVu and Liberation have two weights. For
     emphasis between normal and bold, change family or size. */
  --weight-normal: 400;
  --weight-bold: 700;

  /* -- leading and tracking ----------------------------------------------- */
  --leading-tight: 1.15;   /* 30px and up */
  --leading-snug: 1.35;    /* headings 18–24px, table cells */
  --leading-normal: 1.55;  /* body prose */
  --leading-loose: 1.7;    /* prose at --text-meta */
  --track-display: -0.02em;
  --track-normal: 0;
  --track-caps: 0.08em;    /* uppercase labels: required, not decorative */
  --track-micro: 0.04em;   /* 11–13px mono, to offset crowding */

  /* -- space: twelve rungs on a 4pt grid ---------------------------------- */
  --sp-0: 0px;   --sp-2: 2px;   --sp-4: 4px;   --sp-8: 8px;
  --sp-12: 12px; --sp-16: 16px; --sp-20: 20px; --sp-24: 24px;
  --sp-32: 32px; --sp-48: 48px; --sp-64: 64px; --sp-96: 96px;

  /* -- radius: four values ------------------------------------------------ */
  --r-4: 4px; --r-8: 8px; --r-12: 12px; --r-full: 999px;

  /* Every border in the system is one pixel, so pulling an element up by exactly
     one border width is a real measurement rather than a gap off the scale. */
  --hairline: 1px;

  /* -- width -------------------------------------------------------------
     278 + 32 + 726 = 1036 = 1100 − 2×32. The 726/278 split is 2.6115,
     0.249% off φ². Prose caps well below its column: 726px runs about 94
     characters, and 540 runs 70–74. Tables, charts and code use the column. */
  --page-pad: 32px;
  --gutter: 32px;
  --w-rail: 278px;
  --w-text: 726px;
  --w-measure: 540px;
  --shell: 1100px;
  --shell-read: 808px;
  --shell-wide: 1320px;
  --w-steps: 320px;
  --w-pane: 840px;
  --w-card: 344px;
  --w-card-wide: 464px;

  /* -- elevation ---------------------------------------------------------- */
  --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.08);

  /* -- role: light -------------------------------------------------------- */
  --bg: var(--ivory);
  --surface: var(--white);
  --wash: var(--wash-l);
  --line: var(--line-l);
  --line-strong: var(--line-strong-l);
  --oat: var(--oat-l);
  --ink: var(--slate);
  --body: var(--gray-700);
  --muted: var(--gray-600);
  --fill: var(--gray-500);

  /* Slot order is fixed and never cycled. Indigo leads so a single-series chart
     reads as data rather than as branding, and clay sits last because it is also
     the accent, which stays reserved for emphasis. The order is chosen by
     measured adjacent separation: this arrangement lifts the worst adjacent
     tritan pair from 6.6 to 14.9 light and 16.0 dark. */
  --s1: var(--indigo);
  --s2: var(--ochre);
  --s3: var(--plum);
  --s4: var(--teal);
  --s5: var(--clay);

  --critical: var(--red);
  --critical-mark: var(--red);
  --warning: var(--amber);
  --warning-mark: var(--amber);
  --positive: var(--blue);
  --positive-mark: var(--blue);

  --accent: var(--clay);
  --accent-mark: var(--clay);

  /* A solid status or accent fill and the label that sits on it. This pair does
     not follow the text steps: --accent in dark mode is a light orange meant to
     be read as text, and a white label on it measures 2.71:1. A solid fill is a
     non-text object, so it needs 3:1 against the page and 4.5:1 for its own
     label — light mode gets that from the light pigment, dark mode from the mark
     step. Warning is the one whose label differs by mode, because amber is light
     enough that white fails on it. */
  --accent-solid: var(--clay);       --on-accent: var(--white);
  --critical-solid: var(--red);      --on-critical: var(--white);
  --warning-solid: var(--amber);     --on-warning: var(--white);
  --positive-solid: var(--blue);     --on-positive: var(--white);

  /* A tinted surface and its border. Text on one of these is --body. */
  --critical-soft: var(--red-soft);      --critical-line: var(--red-line);
  --warning-soft: var(--amber-soft);     --warning-line: var(--amber-line);
  --positive-soft: var(--blue-soft);     --positive-line: var(--blue-line);
  --accent-soft: var(--clay-soft);       --accent-line: var(--clay-line);
  --critical-hover: var(--red-hover);
  --positive-hover: var(--blue-hover);
  --accent-hover: var(--clay-hover);

  /* An inverted band — a punch slide, a summary callout, a primary control. It is
     defined against the page, so it flips with it: painting one --panel would make
     it the dark page's own colour and invert nothing. The muted tier is its own
     token because it inverts too, and --muted is the page's tier, not this one. */
  --invert: var(--ink);
  --on-invert: var(--bg);
  --on-invert-muted: var(--gray-350);

  --zone: rgba(20, 20, 19, 0.025);
  /* A banded row inside an always-dark panel. It cannot use --zone, which
     inverts with the mode while the panel does not. */
  --panel-zone: rgba(250, 249, 245, 0.045);

  /* -- role: the always-dark panel ---------------------------------------
     A code listing or diff view is one colour in both modes, so the mode-aware
     roles are wrong inside it: --muted resolves to #605F58 in light mode and
     would sit at 2.87:1 on this surface. These do not change between modes,
     which is the whole point of them. */
  --panel: var(--slate);
  --panel-raised: var(--gray-700);
  --panel-ink: var(--paper);
  --panel-body: var(--gray-250);
  /* --gray-500 is 2.98:1 on --panel-raised, so the muted tier steps up one:
     a panel's own de-emphasis tier has to clear AA on the raised surface too,
     not only on the panel. */
  --panel-muted: var(--gray-350);
  /* The seam between a panel and the page, and the one panel role that flips.
     In dark mode --panel and --bg are the same step by design, so a code block
     with no edge has no boundary at all. Light mode needs none: a near-black
     panel on ivory is already its own boundary, so the edge takes the panel's
     colour there and disappears. */
  --panel-edge: var(--panel);

  /* A scrim behind a modal or over an image. Dark in both modes: it darkens
     whatever it covers rather than following the page. */
  --scrim: rgba(20, 20, 19, 0.55);
}

html.dark {
  /* Different steps, never an inversion. */
  --bg: var(--slate);
  --surface: var(--slate-900);
  --wash: var(--slate-800);
  --oat: var(--slate-700);
  --line: var(--slate-600);
  --line-strong: var(--slate-500);
  --ink: var(--paper);
  --body: var(--gray-250);
  --muted: var(--gray-350);
  --fill: var(--gray-500);

  --s1: var(--indigo-on-dark);
  --s2: var(--ochre-on-dark);
  --s3: var(--plum-on-dark);
  --s4: var(--teal-on-dark);
  --s5: var(--clay-mark-on-dark);

  --critical: var(--red-text-on-dark);
  --critical-mark: var(--red-mark-on-dark);
  --warning: var(--amber-text-on-dark);
  --warning-mark: var(--amber-mark-on-dark);
  --positive: var(--blue-text-on-dark);
  --positive-mark: var(--blue-mark-on-dark);

  --accent: var(--clay-text-on-dark);
  --accent-mark: var(--clay-mark-on-dark);

  --accent-solid: var(--clay-mark-on-dark);    --on-accent: var(--white);
  --critical-solid: var(--red-mark-on-dark);   --on-critical: var(--white);
  --warning-solid: var(--amber-mark-on-dark);  --on-warning: var(--slate);
  --positive-solid: var(--blue-mark-on-dark);  --on-positive: var(--white);

  --critical-soft: var(--red-soft-on-dark);   --critical-line: var(--red-line-on-dark);
  --warning-soft: var(--amber-soft-on-dark);  --warning-line: var(--amber-line-on-dark);
  --positive-soft: var(--blue-soft-on-dark);  --positive-line: var(--blue-line-on-dark);
  --accent-soft: var(--clay-soft-on-dark);    --accent-line: var(--clay-line-on-dark);
  --critical-hover: var(--red-hover-on-dark);
  --positive-hover: var(--blue-hover-on-dark);
  --accent-hover: var(--clay-hover-on-dark);

  --panel-edge: var(--gray-600);
  --on-invert-muted: var(--gray-600);

  --zone: rgba(250, 249, 245, 0.03);
  --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.45);

  /* Light-on-dark reads heavier than dark-on-light at the same weight, and a
     weight step down is unavailable on two-weight faces. Loosen instead. */
  --leading-normal: 1.65;
}

/* Numbers that must align in a column or hold position in a chart use the data
   face. tabular-nums measures as a no-op on Georgia, Times, Arial and
   Helvetica, so it is an enhancement and never the mechanism. */
.tabular {
  font-family: var(--font-data);
  font-variant-numeric: tabular-nums;
}

.label-caps {
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  font-size: var(--text-meta);
  font-weight: var(--weight-bold);
}

/* A band cancels the page padding to span the shell's outer box. Neither
   width:100vw nor width:100% is correct: inside a split track both resolve to
   the wrong box, and 100vw ignores the scrollbar. */
.bleed {
  margin-inline: calc(-1 * var(--page-pad));
  padding-inline: var(--page-pad);
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

@media print {
  /* prefers-color-scheme is not suppressed for print, so a dark-mode reader
     exports a black page unless the role layer is reset to light here. */
  :root,
  html.dark {
    color-scheme: light;
    --bg: var(--ivory);
    --surface: var(--white);
    --wash: var(--wash-l);
    --line: var(--line-l);
    --line-strong: var(--line-strong-l);
    --ink: var(--slate);
    --body: var(--gray-700);
    --muted: var(--gray-600);
    --s1: var(--indigo);
    --s2: var(--ochre);
    --s3: var(--plum);
    --s4: var(--teal);
    --s5: var(--clay);
    --critical: var(--red);
    --critical-mark: var(--red);
    --warning: var(--amber);
    --warning-mark: var(--amber);
    --positive: var(--blue);
    --positive-mark: var(--blue);
    --oat: var(--oat-l);
    --panel-edge: var(--panel);
    --on-invert-muted: var(--gray-350);
    --accent: var(--clay);
    --accent-mark: var(--clay);
    --accent-solid: var(--clay);       --on-accent: var(--white);
    --critical-solid: var(--red);      --on-critical: var(--white);
    --warning-solid: var(--amber);     --on-warning: var(--white);
    --positive-solid: var(--blue);     --on-positive: var(--white);
    --critical-soft: var(--red-soft);      --critical-line: var(--red-line);
    --warning-soft: var(--amber-soft);     --warning-line: var(--amber-line);
    --positive-soft: var(--blue-soft);     --positive-line: var(--blue-line);
    --accent-soft: var(--clay-soft);       --accent-line: var(--clay-line);
    --critical-hover: var(--red-hover);
    --positive-hover: var(--blue-hover);
    --accent-hover: var(--clay-hover);
    --leading-normal: 1.45;
  }

  body {
    background: var(--bg);
    color: var(--body);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  thead { display: table-header-group; }
  tr, figure, pre { break-inside: avoid; }
  h1, h2, h3 { break-after: avoid; }
  p { orphans: 3; widows: 3; }

  .no-print { display: none; }

  @page { margin: 16mm; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
/* @house-style-tokens:end */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--body); font-family: var(--font-prose);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── top bar ─────────────────────────────── */
  .bar {
    display: flex; align-items: center; gap: var(--sp-16); flex-wrap: wrap;
    padding: var(--sp-12) var(--sp-20); border-bottom: 1px solid var(--line); flex: none;
  }
  .bar h1 { font-family: var(--font-display); font-weight: var(--weight-normal); font-size: var(--text-h4); color: var(--ink); letter-spacing: -0.01em; }
  .bar .sub { font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); letter-spacing: var(--track-caps); text-transform: uppercase; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: var(--sp-8); flex-wrap: wrap; }
  .chip {
    font-family: var(--font-data); font-size: var(--text-meta-data); letter-spacing: var(--track-micro);
    padding: var(--sp-8) var(--sp-12); min-height: var(--sp-24); border: 1px solid var(--line); border-radius: var(--r-full);
    background: transparent; color: var(--muted); cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  #themeToggle {
    font-family: var(--font-data); font-size: var(--text-meta-data); text-transform: uppercase; letter-spacing: var(--track-caps);
    padding: var(--sp-8) var(--sp-12); min-height: var(--sp-24); border: 1px solid var(--line); border-radius: var(--r-8);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  #themeToggle:hover { color: var(--ink); border-color: var(--muted); }

  /* ── stage ───────────────────────────────── */
  .stage { flex: 1; position: relative; min-height: 0; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* pan + zoom — a diagram worth drawing outgrows the viewport, so the stage is
     a viewport onto it rather than the whole of it. Only the wide layout gets
     this: the narrow layout scrolls the page, and hijacking drag or wheel there
     would trap the reader above the cards. */
  .stage.pz svg { cursor: grab; touch-action: none; }
  .stage.pz.dragging svg, .stage.pz.dragging .node { cursor: grabbing; }
  .stage.pz.settling #svg-content { transition: transform .28s ease; }
  @media (prefers-reduced-motion: reduce) { .stage.pz.settling #svg-content { transition: none; } }

  .zoomctl { display: none; align-items: center; gap: var(--sp-2); }
  .zoomctl.on { display: flex; }
  .zoomctl button {
    font-family: var(--font-data); font-size: var(--text-meta-data); letter-spacing: var(--track-caps);
    padding: var(--sp-8) var(--sp-8); min-height: var(--sp-24); border: 1px solid var(--line); border-radius: var(--r-8);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .zoomctl button:hover { color: var(--ink); border-color: var(--muted); }
  .zoomctl #zoomLevel { min-width: var(--sp-48); text-align: center; font-variant-numeric: tabular-nums; }

  /* zones */
  .zone rect { fill: var(--zone); stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 5; rx: 12; }
  .zone .ztitle { font-family: var(--font-data); font-size: var(--text-meta-data); letter-spacing: var(--track-caps); text-transform: uppercase; fill: var(--muted); }
  .zone .zsub { font-family: var(--font-data); font-size: var(--text-micro); fill: var(--muted); opacity: 0.75; }

  /* nodes */
  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; rx: 8; transition: stroke .15s ease, filter .15s ease; }
  .node:hover rect { stroke: var(--muted); }
  .node.sel rect { stroke: var(--accent) !important; stroke-width: 2; }
  .node .t  { font-family: var(--font-prose); font-size: var(--text-body); font-weight: var(--weight-bold); fill: var(--ink); pointer-events: none; }
  /* Node meta stays at micro. It is a glanced label inside a fixed-geometry box,
     and a step up to --text-meta-data overflows five of these nodes by up to
     15px — the node grid has no horizontal slack to give. */
  .node .m  { font-family: var(--font-data); font-size: var(--text-micro); fill: var(--muted); pointer-events: none; }
  .node .k  { font-family: var(--font-data); font-size: var(--text-micro); letter-spacing: var(--track-caps); text-transform: uppercase; fill: var(--accent); pointer-events: none; }
  .node.gate rect { fill: var(--accent-soft); stroke: var(--accent); }
  .node.store rect { fill: var(--wash); }
  .node.do rect { fill: var(--positive-soft); stroke: var(--positive); }
  .node.ext rect { stroke-dasharray: 6 3; }

  /* edges */
  .edge { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#a-mut); transition: opacity .2s ease, stroke .2s ease; }
  .edge.dash { stroke-dasharray: 5 4; }
  .edge.ws { stroke-width: 2; }
  .elbl { font-family: var(--font-data); font-size: var(--text-micro); fill: var(--muted); transition: opacity .2s ease; }

  /* flow highlighting */
  .stage.flowing .edge { opacity: 0.13; }
  .stage.flowing .elbl { opacity: 0.13; }
  .stage.flowing .node { opacity: 0.30; }
  .stage.flowing .zone { opacity: 0.45; }
  .stage.flowing .edge.lit {
    opacity: 1; stroke: var(--accent); marker-end: url(#a-clay);
    stroke-dasharray: 7 5; animation: march 0.9s linear infinite;
  }
  .stage.flowing .elbl.lit { opacity: 1; fill: var(--accent); }
  .stage.flowing .node.lit { opacity: 1; }
  .stage.flowing .node.lit rect { stroke: var(--accent); }
  @keyframes march { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .stage.flowing .edge.lit { animation: none; } }

  .badge { font-family: var(--font-data); font-size: var(--text-micro); font-weight: var(--weight-bold); }
  .badge circle { fill: var(--accent); }
  .badge text { fill: var(--bg); }
  .stage:not(.flowing) .badge { display: none; }

  /* ── floating cards ──────────────────────── */
  .card {
    position: absolute; max-width: var(--w-card);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-12);
    padding: var(--sp-16) var(--sp-16); box-shadow: var(--shadow-card);
  }
  #detail { right: var(--sp-16); bottom: var(--sp-16); width: var(--w-card); }
  #detail h3 { font-family: var(--font-display); font-weight: var(--weight-normal); font-size: var(--text-lead); color: var(--ink); margin-bottom: var(--sp-2); }
  #detail .meta { font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); margin-bottom: var(--sp-8); }
  #detail p { font-size: var(--text-body); line-height: var(--leading-normal); }
  #detail p code, #flowcap code { font-family: var(--font-data); font-size: var(--text-meta-data); color: var(--accent); }

  /* collapse-to-pill — the detail card defaults to a compact pill so it never
     sits over the diagram until you ask for detail by clicking a node. This is
     the root fix for floating cards obscuring content: reserve nothing, show
     the card only on demand, and give one control to tuck it away again. */
  .card-min {
    position: absolute; top: var(--sp-12); right: var(--sp-12); width: var(--sp-24); height: var(--sp-24);
    display: grid; place-items: center; padding: var(--sp-0);
    border: 1px solid var(--line); border-radius: var(--r-8); background: var(--surface);
    color: var(--muted); font-family: var(--font-data); font-size: var(--text-meta); line-height: 1; cursor: pointer;
  }
  .card-min:hover { color: var(--ink); border-color: var(--muted); }
  #detail .card-inner { padding-right: var(--sp-20); }
  .card-pill { display: none; }
  #detail.collapsed { width: auto; max-width: var(--w-rail); padding: var(--sp-0); cursor: pointer; }
  #detail.collapsed .card-inner, #detail.collapsed .card-min { display: none; }
  #detail.collapsed .card-pill {
    display: flex; align-items: center; gap: var(--sp-8); width: 100%; padding: var(--sp-12) var(--sp-16);
    border: 0; background: none; text-align: left; cursor: pointer;
    font-family: var(--font-data); font-size: var(--text-meta-data); letter-spacing: var(--track-micro); color: var(--muted);
  }
  #detail.collapsed:hover .card-pill { color: var(--ink); }
  .card-pill .chev {
    width: 0; height: 0; margin-left: auto;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 5px solid currentColor;
  }

  #flowcap { left: var(--sp-16); bottom: var(--sp-16); max-width: var(--w-card-wide); display: none; }
  #flowcap.show { display: block; }
  #flowcap.dismissed { display: none; }
  #flowcap .fname { font-family: var(--font-data); font-size: var(--text-micro); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--accent); margin-bottom: var(--sp-8); padding-right: var(--sp-24); }
  #flowcap ol { margin-left: var(--sp-20); }
  #flowcap li { font-size: var(--text-body); line-height: var(--leading-normal); }
  .src { position: absolute; top: var(--sp-12); right: var(--sp-16); font-family: var(--font-data); font-size: var(--text-micro); color: var(--muted); opacity: 0.8; }
  @media (max-width: 880px) {
    body { overflow: auto; }
    .stage { min-height: 70vh; }
    #detail, #detail.collapsed { position: static; width: auto; max-width: none; margin: var(--sp-12) var(--sp-16); padding: var(--sp-16) var(--sp-16); cursor: default; }
    #detail.collapsed .card-inner { display: block; padding-right: 0; }
    #detail .card-inner { padding-right: 0; }
    #detail .card-min, #detail.collapsed .card-min, #detail.collapsed .card-pill { display: none; }
    #flowcap { position: static; margin: var(--sp-0) var(--sp-16) var(--sp-16); }
    #flowcap .card-min { display: none; }
  }

  /* prefers-color-scheme is not suppressed for print, so without this reset a
     reader whose OS is dark exports a black page. The diagram also has to stop
     being a viewport onto itself and lay out at its full height. */
  @media print {
    html, body { height: auto; overflow: visible; }
    body { background: var(--bg); color: var(--body); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .stage { min-height: 0; }
    .stage svg { position: static; height: auto; aspect-ratio: 1440 / 890; }
    .chips, .zoomctl, #themeToggle, .card-min { display: none; }
    #detail, #detail.collapsed, #flowcap {
      position: static; width: auto; max-width: none;
      margin: var(--sp-16) var(--sp-0) var(--sp-0); box-shadow: none;
    }
    #detail.collapsed .card-inner { display: block; padding-right: var(--sp-0); }
    #detail.collapsed .card-pill { display: none; }
    #flowcap { display: block; }
    .card { break-inside: avoid; }
  }
</style>
</head>

<script>
const DETAIL = {
  browser:   { t:"Browser", m:"client · session cookie", b:"The Vite+React SPA, served by the same Worker as the API. Logged-in or anonymous, it's <b>one app</b> — login only unlocks features. Live editing rides a WebSocket per open document." },
  agent:     { t:"Agent / CLI", m:"client · Bearer wsk_live_…", b:"Claude Code, curl, scripts. <b>Same endpoints, same gate, same documents</b> as the UI — an agent edits over HTTP and its change merges live into the same Yjs doc humans are typing in." },
  visitor:   { t:"Anyone with a link", m:"client · no credential", b:"The growth engine. An <code>open</code> workspace's link grants view+edit with no account; <code>public</code> grants view. No tokens, no claim — the link is the keys." },
  spa:       { t:"Static assets", m:"app worker · edge-cached", b:"The SPA shell. <code>run_worker_first</code> pins <code>/v1 /s /auth /parties</code> to the Worker so API calls never fall through to <code>index.html</code>." },
  authroutes:{ t:"/auth/*", m:"app worker · browser-only", b:"Thin redirects to WorkOS hosted login; the callback seals an encrypted session cookie. Scripts never come here — they use API keys." },
  authenticate:{ t:"authenticate", m:"middleware · one identity", b:"Normalizes session cookie / bearer key / nothing into <b>one Identity</b>. Sessions verify against a cached JWKS (zero WorkOS calls per request); keys are one indexed D1 hash lookup." },
  resolve:   { t:"resolveAccess()", m:"the ONE authorization gate", b:"A pure function — workspace row + identity → view / edit / no (and 404 hides existence). HTTP routes, the WebSocket door, and the agent bridge all call <b>this same function</b>. Nothing else decides access." },
  handlers:  { t:"/v1 route handlers", m:"Hono · JSON + markdown", b:"The whole product surface: documents, folder-tree workspaces, comments, version history & restore, duplicate, API keys, <code>/v1/me</code>. Everything the UI can do, an agent can do here." },
  parties:   { t:"/parties/* WS door", m:"WebSocket upgrade", b:"Humans connect here for live editing. <code>onBeforeConnect</code> resolves doc → workspace, runs the same gate, then hands the socket to that document's DO. Cookie-session only by design (agents use HTTP)." },
  bridge:    { t:"Agent edit bridge", m:"getServerByName().applyAgentEdit()", b:"After the gate passes, an agent's PUT/PATCH bridges into the <b>same Document DO</b> via init-safe RPC. The edit merges through Yjs and broadcasts to live editors instantly — one writer, no second path." },
  spub:      { t:"/s/* public reads", m:"cookieless · cacheable", b:"The hot path. Never mounts authenticate, never wakes a DO: a KV visibility pointer gates (fail-closed), then the body serves from edge cache. Checkpoint-fresh (~10s), like Google Docs published links." },
  docdo:     { t:"Document DO", m:"durable object · one per document", b:"The live document. Browsers sync over WebSocket, agents write over RPC — <b>all merge in one Yjs doc</b>. SQLite hot tier makes edits durable between checkpoints; debounced checkpoints flow to the coordinator." },
  coorddo:   { t:"Workspace coordinator", m:"durable object · one per workspace", b:"Born lazily at the first save. The <b>only thing that pushes to the workspace's git repo</b> (structural single-writer), updates the D1 commits projection inline, and owns the expiry alarm. Cold during browsing." },
  workos:    { t:"WorkOS", m:"external · identity", b:"Hosted login (email, Google, GitHub), users, organizations. We mirror nothing but IDs; membership and org come from the verified JWT. SSO/SCIM are a config flip later, not a rewrite." },
  d1:        { t:"D1", m:"SQL · metadata source of truth", b:"One database: workspaces (ownership + visibility), documents (paths), annotations, hashed API keys, and the commits projection (history keyed by <b>document id</b>, so renames never lose it)." },
  artifacts: { t:"Cloudflare Artifacts", m:"git · content source of truth", b:"One repo per workspace; each document is a file. Every save-point is a commit; the API's <code>version</code> is the file's content fingerprint (blob SHA). History, restore, and <code>?version=</code> reads all come from here." },
  kv:        { t:"KV + Cache API", m:"cache · reconstructible only", b:"The visibility pointer (checked before any cached body — switch-to-private fails closed), the public body cache, and the JWKS cache. Nothing here is ever a source of truth." },
  usercontent:{ t:"usercontent Worker", m:"separate registrable domain", b:"Serves rendered/authored HTML from a cookieless second origin, embedded in the app as a sandboxed iframe. Untrusted HTML runs code — origin isolation means it can never reach anyone's session. Non-retrofittable, so it ships day one." },
};

const FLOWS = {
  create: {
    name: "Create — no signup wall",
    edges: ["e-createA","e-authres","e-reshand","e-handd1"],
    nodes: ["agent","browser","authenticate","resolve","handlers","d1"],
    steps: ["<code>POST /v1/documents</code> — anonymous or with a key","One D1 batch insert: workspace + document rows","<code>201</code> with the share link. No DO, no repo yet — <code>version: null</code> until the first save"]
  },
  live: {
    name: "Live edit — human in the browser",
    edges: ["e-spa","e-ws","e-pardo","e-docoord","e-coordart","e-coordd1"],
    nodes: ["browser","spa","parties","docdo","coorddo","artifacts","d1"],
    steps: ["SPA opens a WebSocket per document","The door runs the same gate, hands the socket to the Document DO","Keystrokes merge via Yjs; SQLite makes them durable","Every 2–10s the coordinator commits a save-point to git"]
  },
  agent: {
    name: "Agent edit — curl as a collaborator",
    edges: ["e-createA","e-authres","e-reshand","e-handbr","e-brdo","e-docoord","e-coordart","e-coordd1"],
    nodes: ["agent","authenticate","resolve","handlers","bridge","docdo","coorddo","artifacts","d1"],
    steps: ["<code>PUT /v1/…/documents/{id}</code> with a bearer key","Same gate as everyone, then an init-safe RPC into the document's DO","The edit Yjs-merges and broadcasts to live humans instantly","<code>If-Match</code> compares against the live content — no polling, honest <code>412</code>s"]
  },
  read: {
    name: "Public read — the growth engine",
    edges: ["e-viss","e-skv","e-kvart"],
    nodes: ["visitor","spub","kv","artifacts"],
    steps: ["<code>GET /s/{slug}</code> — no cookie, no auth, no DO","KV pointer says open/public (fail-closed on private)","Body serves from edge cache; cold miss reads the git blob once"]
  },
  login: {
    name: "Login — hosted, sealed, edge-verified",
    edges: ["e-createB","e-authwos","e-jwks"],
    nodes: ["browser","authroutes","authenticate","workos"],
    steps: ["<code>/auth/login</code> redirects to WorkOS hosted sign-in","Callback seals an encrypted session cookie","Every later request verifies the JWT against a cached JWKS — zero WorkOS calls on the hot path"]
  },
  render: {
    name: "HTML render — untrusted code, isolated",
    edges: ["e-iframe","e-ucart"],
    nodes: ["browser","usercontent","artifacts"],
    steps: ["The app embeds <code>rendered_url</code> as a sandboxed iframe","A cookieless Worker on a separate domain serves the HTML","Cross-origin + sandbox: the document's code can never touch a login"]
  }
};

const stage = document.getElementById('stage');
const nodes = document.querySelectorAll('.node');
const edges = document.querySelectorAll('.edge');
const elbls = document.querySelectorAll('.elbl');
const chips = document.querySelectorAll('.chip');
const fcap = document.getElementById('flowcap');
const detail = document.getElementById('detail');
const dPillLabel = document.getElementById('d-pill-label');
const setDetail = collapsed => detail.classList.toggle('collapsed', collapsed);
document.getElementById('d-min').addEventListener('click', () => setDetail(true));
document.getElementById('d-pill').addEventListener('click', () => setDetail(false));

function setFlow(key) {
  chips.forEach(c => c.classList.toggle('on', c.dataset.flow === key));
  edges.forEach(e => e.classList.remove('lit'));
  elbls.forEach(l => l.classList.remove('lit'));
  nodes.forEach(n => n.classList.remove('lit'));
  if (key === 'all') { stage.classList.remove('flowing'); fcap.classList.remove('show'); return; }
  const f = FLOWS[key];
  stage.classList.add('flowing');
  f.edges.forEach(id => document.getElementById(id)?.classList.add('lit'));
  elbls.forEach(l => { if (f.edges.includes(l.dataset.e)) l.classList.add('lit'); });
  f.nodes.forEach(k => document.querySelector(`.node[data-k="${k}"]`)?.classList.add('lit'));
  document.getElementById('f-name').textContent = f.name;
  document.getElementById('f-steps').innerHTML = f.steps.map(s => `<li>${s}</li>`).join('');
  fcap.classList.remove('dismissed');
  fcap.classList.add('show');
}
document.getElementById('f-dismiss').addEventListener('click', () => fcap.classList.add('dismissed'));
chips.forEach(c => c.addEventListener('click', () => setFlow(c.dataset.flow)));

nodes.forEach(n => n.addEventListener('click', () => {
  nodes.forEach(x => x.classList.remove('sel'));
  n.classList.add('sel');
  const d = DETAIL[n.dataset.k];
  if (!d) return;
  document.getElementById('d-title').textContent = d.t;
  document.getElementById('d-meta').textContent = d.m;
  document.getElementById('d-body').innerHTML = d.b;
  dPillLabel.textContent = d.t;
  setDetail(false);
}));

/* ── pan + zoom ────────────────────────────────────────────────────────────
   The stage is a viewport onto a diagram bigger than it. One transform on
   #svg-content is the whole camera: translate in viewBox units, then scale. */
const svg = stage.querySelector('svg');
const content = document.getElementById('svg-content');
const zoomctl = document.getElementById('zoomctl');
const zoomLevel = document.getElementById('zoomLevel');
const WIDE = matchMedia('(min-width: 881px)');
const MIN_K = 0.6, MAX_K = 4, DRAG_SLOP = 5;

let k = 1, tx = 0, ty = 0;
let panning = false, dragged = false;
let startX = 0, startY = 0, startTx = 0, startTy = 0;
let swallowNextClick = false;

function draw() {
  content.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${k.toFixed(4)})`);
  zoomLevel.textContent = Math.round(k * 100) + '%';
}

/* viewBox units per screen pixel. Set by the fitted viewBox, so it is constant
   — and it is NOT the zoom scale. Dividing the mouse delta by k is the tempting
   bug: it makes dragging feel sluggish exactly when you are zoomed in and
   leaning on it most. */
function unitsPerPixel() {
  const m = svg.getScreenCTM();
  return m ? 1 / m.a : 1;
}

function toViewBox(clientX, clientY) {
  const m = svg.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  return new DOMPoint(clientX, clientY).matrixTransform(m.inverse());
}

/* Zoom about a point: the content under `anchor` has to stay under it. */
function zoomTo(next, anchor) {
  next = Math.min(MAX_K, Math.max(MIN_K, next));
  if (next === k) return;
  tx = anchor.x - (anchor.x - tx) * (next / k);
  ty = anchor.y - (anchor.y - ty) * (next / k);
  k = next;
}

function settle(move) {
  stage.classList.add('settling');
  move();
  draw();
  setTimeout(() => stage.classList.remove('settling'), 320);
}

const stageCentre = () => {
  const r = svg.getBoundingClientRect();
  return toViewBox(r.left + r.width / 2, r.top + r.height / 2);
};

svg.addEventListener('pointerdown', e => {
  if (!stage.classList.contains('pz') || e.button !== 0) return;
  swallowNextClick = false;   // clears a guard stranded by a release off-window
  panning = true; dragged = false;
  startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
  stage.classList.remove('settling');
  /* Capturing here would retarget the compatibility mouse events to the <svg>,
     so a plain click would never reach the node that was clicked. Capture is
     claimed in pointermove instead, once this is definitely a drag. */
});

svg.addEventListener('pointermove', e => {
  if (!panning) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (!dragged) {
    if (Math.hypot(dx, dy) <= DRAG_SLOP) return;
    dragged = true;
    stage.classList.add('dragging');
    svg.setPointerCapture(e.pointerId);
  }
  const u = unitsPerPixel();
  tx = startTx + dx * u;
  ty = startTy + dy * u;
  draw();
});

function endPan(e) {
  if (!panning) return;
  panning = false;
  stage.classList.remove('dragging');
  if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
  if (dragged) swallowNextClick = true;   // a drag that ends on a node is not a click
}
svg.addEventListener('pointerup', endPan);
svg.addEventListener('pointercancel', endPan);

stage.addEventListener('click', e => {
  if (!swallowNextClick) return;
  swallowNextClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

svg.addEventListener('wheel', e => {
  if (!stage.classList.contains('pz')) return;
  e.preventDefault();
  const lines = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomTo(k * Math.pow(0.999, lines), toViewBox(e.clientX, e.clientY));
  draw();
}, { passive: false });

document.getElementById('zoomIn').addEventListener('click', () => settle(() => zoomTo(k * 1.25, stageCentre())));
document.getElementById('zoomOut').addEventListener('click', () => settle(() => zoomTo(k / 1.25, stageCentre())));
document.getElementById('zoomReset').addEventListener('click', () => settle(() => { k = 1; tx = 0; ty = 0; }));

/* The narrow layout scrolls the page, so it keeps native scroll and pinch —
   claiming drag and wheel there would trap the reader above the cards. */
function applyPanZoomMode() {
  const on = WIDE.matches;
  stage.classList.toggle('pz', on);
  zoomctl.classList.toggle('on', on);
  if (!on) { k = 1; tx = 0; ty = 0; }
  draw();
}
WIDE.addEventListener('change', applyPanZoomMode);
applyPanZoomMode();

document.getElementById('themeToggle').addEventListener('click', () => {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
});
</script>
</body>
</html>
